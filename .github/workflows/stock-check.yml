name: iPhone stock check

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "watch | summary | test"
        default: "watch"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 check_stock.py "${{ inputs.mode }}"
          else
            python3 check_stock.py watch
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
